name: macOS shortcut scenarios

# Real released wraithcairn.app on a macOS runner, driven from OUTSIDE the
# app (scripts/macos-drive.swift: CGEvents through the window server, like
# a keyboard and mouse). Each scenario checks what a user would see:
# whether Ctrl+Shift+I started dictation (trace + what reached the pane),
# and any extra windows that appeared (first-run model download dialog).

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated release tags, latest last (default: latest release)"
        required: false
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: mac-shortcut-scenarios-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  scenarios:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [model-installed, first-run-no-model, restored-split-layout, cmd-shift, dvorak, aliases]
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="${{ inputs.versions }}"
          [ -n "$tags" ] || tags="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          # Compare releases with a manual run, e.g. versions="v0.2.7 v0.2.13" (latest last).
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          for t in $tags; do
            mkdir -p "rel/$t"
            gh release download "$t" --repo "$GITHUB_REPOSITORY" --pattern "*-osx-${{ matrix.arch }}.zip" --dir "rel/$t"
            ditto -x -k rel/$t/*.zip "rel/$t"
            ls "rel/$t"
          done
          curl -fsSL -o "$RUNNER_TEMP/jfk.wav" \
            https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06/resolve/572aaf4e2e0c603c3fc2a574d096e755a178faa1/test_wavs/0.wav
          swiftc -O scripts/macos-drive.swift -o "$RUNNER_TEMP/drive"
          # x64 builds run under Rosetta 2 on the Apple Silicon runner.
          if [ "${{ matrix.arch }}" = x64 ]; then softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true; fi

      - name: Run scenario ${{ matrix.scenario }} (${{ matrix.arch }})
        run: |
          drive="$RUNNER_TEMP/drive"
          scenario="${{ matrix.scenario }}"
          for t in $TAGS; do
            echo "::group::$t $scenario"
            exe="$PWD/rel/$t/wraithcairn.app/Contents/MacOS/wraithcairn"
            echo "ARCH $(file -b "$exe" | cut -c1-60)"
            cfg="$RUNNER_TEMP/cfg-$t"; rm -rf "$cfg"; mkdir -p "$cfg"
            export WRAITHCAIRN_CONFIG_DIR="$cfg"
            echo '{ "useGhosttyConfig": false, "showSplash": false, "voiceIdleStopSeconds": 0 }' > "$cfg/config.json"
            if [ "$scenario" != first-run-no-model ]; then "$exe" voice --download | tail -1; fi
            if [ "$scenario" = restored-split-layout ]; then
              pane() { printf '{ "id": "%s", "title": null, "profileId": null, "workingDirectory": null, "transportId": "pty", "transportProfileId": null, "split": null, "startup": null }' "$1"; }
              cat > "$cfg/workspace.json" <<EOF
          { "formatVersion": 1, "selectedWindowId": "window-1", "windows": [ {
            "id": "window-1", "title": "t", "selectedTabId": "tab-2", "widthPixels": 1200, "heightPixels": 800,
            "isMaximized": false, "tabsInTitleBar": false,
            "tabs": [
              { "id": "tab-1", "profileId": "default", "title": "one", "workingDirectory": null, "transportId": "pty", "transportProfileId": null, "renderMode": "Default", "rootPane": $(pane p1) },
              { "id": "tab-2", "profileId": "default", "title": "two", "workingDirectory": null, "transportId": "pty", "transportProfileId": null, "renderMode": "Default",
                "rootPane": { "id": "p2", "title": null, "profileId": null, "workingDirectory": null, "transportId": null, "transportProfileId": null,
                  "split": { "orientation": "Vertical", "ratio": 0.5, "firstPane": $(pane p3), "secondPane": $(pane p4) } } } ] } ] }
          EOF
            fi
            out="$RUNNER_TEMP/pane-$t.txt"; rm -f "$out"
            WRAITHCAIRN_TRACE=1 WRAITHCAIRN_VOICE_TEST_WAV="$RUNNER_TEMP/jfk.wav" "$exe" > "$RUNNER_TEMP/app-$t.log" 2>&1 &
            pid=$!
            # Wait for the window (first launch under Rosetta translates first).
            for i in $(seq 1 60); do "$drive" windows $pid | grep -q "wraithcairn layer=0" && break; sleep 1; done
            echo "window after ${i}s"
            sleep 4
            "$drive" windows $pid
            "$drive" click $pid
            sleep 1
            "$drive" keys "text:stty raw -echo; cat > $out" return sleep:1.5
            if [ "$scenario" = aliases ]; then
              # Cmd+Shift+letter = Ctrl+Shift+letter, with effects a user sees:
              # O splits, W closes, V pastes once; nothing leaks to the program.
              leaves() { python3 scripts/workspace-leaves.py "$cfg/workspace.json"; }
              printf 'wc-paste-marker' | pbcopy
              "$drive" keys cmd+shift+o sleep:7    # layout autosaves 5 s after changes
              after_split=$(leaves)
              "$drive" keys cmd+shift+w sleep:7
              after_close=$(leaves)
              "$drive" click $pid; sleep 0.5
              "$drive" keys cmd+shift+v sleep:1 cmd+shift+z sleep:0.5 cmd+shift+z sleep:1
              "$drive" keys ctrl+c sleep:1
              got=$(tr -d '\003' < "$out" 2>/dev/null || true)   # drop our own Ctrl+C
              echo "aliases: leaves after Cmd+Shift+O=$after_split after Cmd+Shift+W=$after_close pane_got=$(printf '%s' "$got" | od -An -c | tr -s ' ')"
              if [ "$after_split" = 2 ] && [ "$after_close" = 1 ] && [ "$got" = "wc-paste-marker" ]; then result=WORKS; else result=FAILED; fi
              echo "RESULT $t $scenario: $result (alias effects)"
              echo "$t $result" >> "$RUNNER_TEMP/results.txt"
              kill $pid 2>/dev/null || true; sleep 2; echo "::endgroup::"; continue
            fi
            if [ "$scenario" = cmd-shift ]; then chordk=cmd+shift+i; else chordk=ctrl+shift+i; fi
            if [ "$scenario" = dvorak ]; then
              # Dvorak: the key that types "i" sits where QWERTY has "g" (keycode 0x05).
              "$drive" layout com.apple.keylayout.Dvorak
              press() { "$drive" keycode 0x05 ctrl shift; }
            else
              press() { "$drive" keys $chordk; }
            fi
            press; sleep 4
            echo "-- windows after first $chordk"; "$drive" windows $pid | tee "$RUNNER_TEMP/windows-$t.txt"
            sleep 7; press; sleep 3
            # Second try, as a user would after nothing seemed to happen.
            press; sleep 6; press; sleep 3
            "$drive" keys ctrl+c sleep:1
            [ "$scenario" = dvorak ] && "$drive" layout com.apple.keylayout.US || true
            echo "-- trace"
            grep -E "TRACE (key I|voice)|VOICE" "$RUNNER_TEMP/app-$t.log" | head -20 || true
            echo "-- pane received: $(od -c "$out" 2>/dev/null | head -5 | tr -s ' ')"
            if grep -qi "country" "$out" 2>/dev/null; then result=DICTATED; else result="NOTHING TYPED"; fi
            if [ "$scenario" = first-run-no-model ]; then
              # First use must offer the model download, in front of the window.
              if grep -q "name=Voice Input" "$RUNNER_TEMP/windows-$t.txt"; then result="DOWNLOAD DIALOG"; fi
            fi
            echo "RESULT $t $scenario: $result"
            echo "$t $result" >> "$RUNNER_TEMP/results.txt"
            kill $pid 2>/dev/null || true
            sleep 2
            echo "::endgroup::"
          done
          # The newest release must work in every scenario.
          latest=${TAGS##* }
          want=DICTATED; [ "$scenario" = first-run-no-model ] && want="DOWNLOAD DIALOG"; [ "$scenario" = aliases ] && want=WORKS
          grep -q "^$latest $want\$" "$RUNNER_TEMP/results.txt" || { echo "$latest $scenario: expected $want"; exit 1; }
