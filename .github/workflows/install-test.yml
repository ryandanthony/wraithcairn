# Runs the one-line installers (website/static/install, install.ps1) on all
# six release platforms against the latest published release: install,
# --version, reinstall, a pinned older version, then uninstall.
#
# Runs when an installer changes, after every Release (so a new release that
# breaks the installer shows up right away), and on demand.
name: Install scripts

on:
  push:
    branches: [main]
    paths:
      - "website/static/install"
      - "website/static/install.ps1"
      - ".github/workflows/install-test.yml"
  pull_request:
    paths:
      - "website/static/install"
      - "website/static/install.ps1"
      - ".github/workflows/install-test.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck website/static/install
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer website/static/install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $r | Format-Table -AutoSize | Out-String -Width 200
          if ($r) { throw "PSScriptAnalyzer found $($r.Count) issue(s)" }

  unix:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
    name: install (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install (piped, as from curl)
        run: |
          set -euo pipefail
          out=$(bash < website/static/install 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "(${{ matrix.rid }})"

      - name: Check install
        run: |
          set -euo pipefail
          "$HOME/.local/bin/wraithcairn" --version | tee version.txt
          grep -Eq '^wraithcairn [0-9]+\.[0-9]+\.[0-9]+' version.txt
          if [ "$RUNNER_OS" = Linux ]; then
            test -f "$HOME/.local/share/applications/wraithcairn.desktop"
            grep -q "Exec=\"$HOME/.local/bin/wraithcairn\"" "$HOME/.local/share/applications/wraithcairn.desktop"
            test -f "$HOME/.local/share/icons/hicolor/256x256/apps/wraithcairn.png"
          else
            app=/Applications/wraithcairn.app
            [ -d "$app" ] || app="$HOME/Applications/wraithcairn.app"
            test -x "$app/Contents/MacOS/wraithcairn"
            codesign --verify --deep --strict "$app"
            if xattr -p com.apple.quarantine "$app" 2>/dev/null; then echo "quarantine flag left on"; exit 1; fi
          fi

      - name: Reinstall, then pin the previous release
        run: |
          set -euo pipefail
          bash < website/static/install | tee re.txt
          grep -q "already installed; reinstalling" re.txt
          latest=$(awk '{print $2}' version.txt)
          # Previous patch tag, if it exists (first release has none).
          IFS=. read -r ma mi pa <<<"$latest"
          if [ "$pa" -gt 0 ]; then
            bash -s -- --version "v$ma.$mi.$((pa - 1))" < website/static/install
            "$HOME/.local/bin/wraithcairn" --version | grep -q "^wraithcairn $ma.$mi.$((pa - 1))"
          fi

      # Self-update from the pinned previous release back to the latest.
      # Skipped while the previous release predates `wraithcairn update`.
      - name: wraithcairn update (previous -> latest)
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin/wraithcairn"
          latest=$(awk '{print $2}' version.txt)
          if ! "$bin" update --help >/dev/null 2>&1; then
            echo "installed $("$bin" --version) has no update command yet; skipping"
            exit 0
          fi
          rc=0; "$bin" update --check || rc=$?
          [ "$rc" = 10 ] || { echo "expected exit 10 (update available), got $rc"; exit 1; }
          "$bin" update
          "$bin" --version | grep -q "^wraithcairn $latest\$"
          "$bin" update | grep -q "up to date"

      - name: Bad version fails cleanly
        run: |
          if bash -s -- --version v0.0.0-nope < website/static/install; then
            echo "expected failure"; exit 1
          fi

      - name: Uninstall
        run: |
          set -euo pipefail
          bash -s -- --uninstall < website/static/install
          test ! -e "$HOME/.local/bin/wraithcairn"
          if [ "$RUNNER_OS" = Linux ]; then
            test ! -e "$HOME/.local/share/applications/wraithcairn.desktop"
          else
            test ! -e /Applications/wraithcairn.app
            test ! -e "$HOME/Applications/wraithcairn.app"
          fi

  windows:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    name: install (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install (irm | iex style)
        run: |
          $out = Get-Content -Raw website/static/install.ps1 | Invoke-Expression *>&1 | Out-String
          $out
          if ($out -notmatch [regex]::Escape('(${{ matrix.rid }})')) { throw 'wrong build picked' }

      - name: Check install
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\wraithcairn'
          $exe = Join-Path $dir 'wraithcairn.exe'
          $v = & $exe --version | Select-Object -First 1
          $v
          if ($v -notmatch '^wraithcairn \d+\.\d+\.\d+') { throw "bad --version: $v" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'wraithcairn.lnk'
          if (-not (Test-Path $lnk)) { throw 'no Start menu shortcut' }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $exe) { throw "shortcut points at $target" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $dir) { throw 'install dir not on user PATH' }
          # Windows PowerShell 5.1 must work too (the default on Windows).
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw website/static/install.ps1 | Invoke-Expression"
          if ($LASTEXITCODE) { throw "Windows PowerShell 5.1 install failed ($LASTEXITCODE)" }

      - name: Pinned version via scriptblock parameters
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\wraithcairn\wraithcairn.exe'
          $latest = ((& $exe --version | Select-Object -First 1) -split ' ')[1]
          $ma, $mi, $pa = $latest -split '\.'
          if ([int]$pa -gt 0) {
            $pin = "v$ma.$mi.$([int]$pa - 1)"
            & ([scriptblock]::Create((Get-Content -Raw website/static/install.ps1))) -Version $pin
            $v = & $exe --version | Select-Object -First 1
            if ($v -ne "wraithcairn $($pin.TrimStart('v'))") { throw "pin failed: $v" }
          }

      - name: wraithcairn update (previous -> latest)
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\wraithcairn\wraithcairn.exe'
          $installed = ((& $exe --version | Select-Object -First 1) -split ' ')[1]
          # wraithcairn.exe is a GUI-subsystem app: PowerShell only waits for
          # it (and sets $LASTEXITCODE) when its output is piped.
          $help = & $exe update --help | Out-String
          if ($LASTEXITCODE -ne 0 -or $help -notmatch 'usage: wraithcairn update') { "wraithcairn $installed has no update command yet; skipping"; exit 0 }
          & $exe update --check | Out-Host
          if ($LASTEXITCODE -ne 10) { throw "expected exit 10 (update available), got $LASTEXITCODE" }
          # Reproduce the flake seen on win-arm64 ("being used by another
          # process"): something like Defender or the indexer holds the exe
          # open without FILE_SHARE_DELETE for a moment, so the rename fails.
          # Releases from v0.1.33 retry for ~5s; hold a lock for 3s.
          $ma, $mi, $pa = $installed -split '\.'
          $retries = ([int]$ma -gt 0) -or ([int]$mi -gt 1) -or ([int]$pa -ge 33)
          if ($retries) {
            $ready = Join-Path $env:RUNNER_TEMP 'lock-ready'
            Remove-Item $ready -ErrorAction SilentlyContinue
            $locker = Start-Process pwsh -PassThru -NoNewWindow -ArgumentList '-NoProfile', '-Command', `
              "`$fs = [IO.File]::Open('$exe', 'Open', 'Read', 'Read'); New-Item '$ready' | Out-Null; Start-Sleep 3; `$fs.Close()"
            while (-not (Test-Path $ready)) { Start-Sleep -Milliseconds 50 }
            # The lock really does break a plain rename, like in the flake.
            $probe = $null
            try { [IO.File]::Move($exe, "$exe.probe"); [IO.File]::Move("$exe.probe", $exe); $probe = 'rename worked' }
            catch { $probe = $_.Exception.InnerException.Message ?? $_.Exception.Message }
            "while locked: $probe"
            if ($probe -notmatch 'being used by another process') { throw "lock did not reproduce the sharing violation: $probe" }
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $exe update | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "update failed ($LASTEXITCODE)" }
          "update took $([int]$sw.Elapsed.TotalSeconds)s"
          if ($retries) { $locker.WaitForExit() }
          $v = & $exe --version | Select-Object -First 1
          "now: $v"
          if ($v -eq "wraithcairn $installed") { throw 'still on the old version' }
          & $exe update --check | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "still not up to date after update (check exit $LASTEXITCODE)" }
          exit 0

      - name: Bad version fails cleanly
        run: |
          $failed = $false
          try { & ([scriptblock]::Create((Get-Content -Raw website/static/install.ps1))) -Version v0.0.0-nope } catch { $failed = $true; "threw: $_" }
          if (-not $failed) { throw 'expected failure' }

      # Control for the lock test above: v0.1.32, the last release without
      # the sharing-violation retry, must fail under the same lock. If it
      # passes, the lock no longer reproduces the flake and the test above
      # proves nothing.
      - name: Control - pre-retry updater fails under the lock
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\wraithcairn\wraithcairn.exe'
          & ([scriptblock]::Create((Get-Content -Raw website/static/install.ps1))) -Version v0.1.32 | Out-Null
          $ready = Join-Path $env:RUNNER_TEMP 'lock-ready-control'
          $locker = Start-Process pwsh -PassThru -NoNewWindow -ArgumentList '-NoProfile', '-Command', `
            "`$fs = [IO.File]::Open('$exe', 'Open', 'Read', 'Read'); New-Item '$ready' | Out-Null; Start-Sleep 3; `$fs.Close()"
          while (-not (Test-Path $ready)) { Start-Sleep -Milliseconds 50 }
          $out = & $exe update 2>&1 | Out-String
          $rc = $LASTEXITCODE
          $locker.WaitForExit()
          $out
          if ($rc -eq 0 -or $out -notmatch 'being used by another process') { throw "control did not fail as expected (exit $rc)" }
          "control failed as expected (exit $rc)"
          # Leave the latest installed for the uninstall step.
          & ([scriptblock]::Create((Get-Content -Raw website/static/install.ps1))) | Out-Null

      - name: Uninstall
        run: |
          & ([scriptblock]::Create((Get-Content -Raw website/static/install.ps1))) -Uninstall
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\wraithcairn'
          if (Test-Path (Join-Path $dir 'wraithcairn.exe')) { throw 'exe still there' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'wraithcairn.lnk')) { throw 'shortcut still there' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $dir) { throw 'still on user PATH' }
