name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Selftest (headless, run 1 - save)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          OUTPUT=$(timeout 90 xvfb-run -a dotnet run -c Release --no-build -- --selftest 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "SELFTEST echo_output_visible=True"
          echo "$OUTPUT" | grep -q "SELFTEST ghostty=True"
          echo "$OUTPUT" | grep -q "SELFTEST headers=True"
          echo "$OUTPUT" | grep -q "SELFTEST header_running=True idle_after=True"
          echo "$OUTPUT" | grep -q "SELFTEST pane_swap=True alive=True"
          echo "$OUTPUT" | grep -q "SELFTEST header_drag_swap=True order_restored=True"
          echo "$OUTPUT" | grep -q "SELFTEST menu_open_saved=True menu_delete_saved=True"
          echo "$OUTPUT" | grep -q "SELFTEST splash shown=True closed=True"
          echo "$OUTPUT" | grep -q "SELFTEST ctrl_c_interrupts=True was_running=True with_selection=True"
          echo "$OUTPUT" | grep -q "SELFTEST mac_ctrl_c_interrupts=True"
          echo "$OUTPUT" | grep -q "SELFTEST mac_ctrl_letters=True"
          echo "$OUTPUT" | grep -q "SELFTEST shift_digits_kitty=True"
          echo "$OUTPUT" | grep -q "SELFTEST shift_digits_kitty_with_text=True"
          echo "$OUTPUT" | grep -q "SELFTEST context_menu_clipboard=True plain_ctrl_keys_free=True"
          echo "$OUTPUT" | grep -q "SELFTEST menu_split_left=True"
          echo "$OUTPUT" | grep -q "SELFTEST menu_split_up=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_catalog=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_preview=True search=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_apply=True downloaded=True saved=True comments_kept=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_new_pane=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_cancel_reverts=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_download_all=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_watch_config=True"
          echo "$OUTPUT" | grep -q "SELFTEST theme_restored=True"
          echo "$OUTPUT" | grep -q "SELFTEST update_menu=True update_check=True"
          echo "$OUTPUT" | grep -q "SELFTEST update_version_order=True"
          echo "$OUTPUT" | grep -q "SELFTEST menu_order=True help_menu=True close_in_pane=True view_clean=True"
          echo "$OUTPUT" | grep -q "SELFTEST voice_download=True retried=True resumed=True"
          echo "$OUTPUT" | grep -q "SELFTEST voice_retry=True try_again_offered=True"
          echo "$OUTPUT" | grep -q "SELFTEST voice_cancel=True"
          echo "$OUTPUT" | grep -q "SELFTEST shortcut_keys_not_leaked=True"
          echo "$OUTPUT" | grep -q "SELFTEST split_focus=True"

      # Voice input (Ctrl+Shift+I): pinned model download, offline
      # recognition, voiceModelsDir, and dictation into a pane (Linux runs
      # the GUI part under Xvfb; all OSes check the native sherpa-onnx +
      # OpenAL libraries load and recognize speech).
      - name: Voice input
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            scripts/test-voice.sh
          else
            # Through the dotnet host (a console app), so stdout is a plain
            # pipe on Windows too (the app itself is a WinExe).
            wc() { dotnet bin/Release/net10.0/wraithcairn.dll "$@"; }
            export WRAITHCAIRN_CONFIG_DIR="$RUNNER_TEMP/voice-cfg"
            wc voice --download
            curl -fsSL -o "$RUNNER_TEMP/jfk.wav" \
              https://huggingface.co/csukuangfj/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06/resolve/572aaf4e2e0c603c3fc2a574d096e755a178faa1/test_wavs/0.wav
            text=$(wc voice --transcribe "$RUNNER_TEMP/jfk.wav" | tr -d '\r')
            echo "transcribed: $text"
            echo "$text" | grep -qi "what your country can do for you"
            wc voice --devices || echo "(no microphone on this runner; capture library loaded)"
          fi

      # Windows: the GUI dictation selftest (WAV as the microphone): words
      # reach the prompt live, corrections leave nothing behind, no Enter.
      - name: Voice dictation in a pane (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          export WRAITHCAIRN_CONFIG_DIR="$RUNNER_TEMP/voice-cfg"
          echo '{ "useGhosttyConfig": false, "showSplash": false }' > "$WRAITHCAIRN_CONFIG_DIR/config.json"
          export WRAITHCAIRN_VOICE_SELFTEST_MODEL="$WRAITHCAIRN_CONFIG_DIR/models/sherpa-onnx-streaming-zipformer-en-kroko-2025-08-06"
          export WRAITHCAIRN_VOICE_SELFTEST_WAV="$RUNNER_TEMP/jfk.wav"
          dotnet bin/Release/net10.0/wraithcairn.dll --selftest > "$RUNNER_TEMP/st.txt" 2>&1 &
          pid=$!
          for i in $(seq 1 240); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep "SELFTEST voice" "$RUNNER_TEMP/st.txt"
          grep -q "SELFTEST voice_live_edits=True" "$RUNNER_TEMP/st.txt"
          grep -q "SELFTEST voice_dictate=True.*live_before_final=True edits_clean=True" "$RUNNER_TEMP/st.txt"

      # Same packaging as release.yml (single-file publish -> .app -> ad-hoc
      # codesign), then speech recognition from inside the signed bundle:
      # the self-extracted sherpa-onnx / onnxruntime / OpenAL dylibs must load
      # under the bundle's signature, and Info.plist must carry the
      # microphone usage string (macOS kills the app without it).
      - name: Voice input from signed .app (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          dotnet publish -c Release -r osx-arm64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -o "$RUNNER_TEMP/macpub"
          python3 scripts/make-macos-app.py "$RUNNER_TEMP/macpub" "$RUNNER_TEMP/app" 0.0.0
          codesign --force --deep --sign - "$RUNNER_TEMP/app/wraithcairn.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/app/wraithcairn.app"
          plutil -extract NSMicrophoneUsageDescription raw "$RUNNER_TEMP/app/wraithcairn.app/Contents/Info.plist"
          exe="$RUNNER_TEMP/app/wraithcairn.app/Contents/MacOS/wraithcairn"
          text=$(WRAITHCAIRN_CONFIG_DIR="$RUNNER_TEMP/voice-cfg" "$exe" voice --transcribe "$RUNNER_TEMP/jfk.wav")
          echo "transcribed (app): $text"
          echo "$text" | grep -qi "what your country can do for you"
          WRAITHCAIRN_CONFIG_DIR="$RUNNER_TEMP/voice-cfg" "$exe" voice --devices || true

      # Window shortcuts on macOS from real key events: NSEvents through
      # [NSApp sendEvent:] and CGEvents through the window server (like a
      # physical keyboard), Ctrl+Shift and the Cmd+Shift alias. Ctrl+Shift+I
      # then dictates the WAV into the pane from inside the signed .app.
      - name: Shortcuts from real key events (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          export WRAITHCAIRN_CONFIG_DIR="$RUNNER_TEMP/voice-cfg"
          echo '{ "useGhosttyConfig": false, "showSplash": false }' > "$WRAITHCAIRN_CONFIG_DIR/config.json"
          exe="$RUNNER_TEMP/app/wraithcairn.app/Contents/MacOS/wraithcairn"
          WRAITHCAIRN_VOICE_TEST_WAV="$RUNNER_TEMP/jfk.wav" "$exe" --mac-key-probe > "$RUNNER_TEMP/probe.txt" 2>&1 &
          pid=$!
          for i in $(seq 1 180); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          grep "^PROBE" "$RUNNER_TEMP/probe.txt"
          grep -q "^PROBE ctrl+shift+i .*voice_toggled=True" "$RUNNER_TEMP/probe.txt"
          grep -q "^PROBE cmd+shift+i .*voice_toggled=True" "$RUNNER_TEMP/probe.txt"
          for how in pid hid hid-cmd; do
            grep -q "^PROBE cg-$how shift+i .*listening=True dictated=True live_before_final=True stopped=True" "$RUNNER_TEMP/probe.txt"
          done

      - name: Theme CLI (offline catalog)
        if: matrix.os == 'ubuntu-latest'
        run: |
          scripts/test-theme-cli.sh
          python3 scripts/test-config-edits.py

      # Theme changes from outside (CLI, config.json, Ghostty config) repaint
      # a running window: checked on screen pixels, plus menu contrast.
      - name: Live theme repaint (pixels)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y python3-pil
          Xvfb :99 -screen 0 1200x800x24 &
          sleep 2
          DISPLAY_TEST=:99 scripts/test-live-theme.sh

      - name: Selftest (headless, run 2 - restore)
        if: matrix.os == 'ubuntu-latest'
        run: |
          OUTPUT=$(timeout 90 xvfb-run -a dotnet run -c Release --no-build -- --selftest 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "SELFTEST phase=restored"
          echo "$OUTPUT" | grep -q "SELFTEST zoom_roundtrip=True"
          echo "$OUTPUT" | grep -q "SELFTEST header_drag_swap=True order_restored=True"

      # Same keyboard checks without XKB, as under the native Wayland
      # backend with no XWayland (WRAITHCAIRN_WAYLAND=1 sessions).
      - name: Selftest (no XKB / Wayland key path)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -f ~/.config/wraithcairn/workspace.json
          OUTPUT=$(WRAITHCAIRN_NO_XKB=1 timeout 90 xvfb-run -a dotnet run -c Release --no-build -- --selftest 2>&1) || true
          echo "$OUTPUT" | grep -E "SELFTEST (shift_digits|mac_ctrl_letters|ctrl_c)"
          echo "$OUTPUT" | grep -q "SELFTEST shift_digits_kitty_with_text=True xkb=False"
          echo "$OUTPUT" | grep -q "SELFTEST mac_ctrl_letters=True"
          rm -f ~/.config/wraithcairn/workspace.json

      # Finder/Dock launch on macOS: bare launchd PATH, Homebrew PATH only in
      # ~/.zprofile. zsh shell panes and exec panes must still find tools.
      - name: Login PATH (zsh, Finder-style launch)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y zsh xvfb
            WRAITHCAIRN_LOGIN=1 xvfb-run -a scripts/test-login-path.sh
          else
            scripts/test-login-path.sh
          fi

      # Releases ship single-file executables; make sure that packaging still
      # finds libghostty-vt and can spawn a PTY.
      - name: Selftest (single-file publish)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet publish -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -o "$RUNNER_TEMP/single"
          rm -f ~/.config/wraithcairn/workspace.json
          OUTPUT=$(cd "$RUNNER_TEMP" && timeout 90 xvfb-run -a "$RUNNER_TEMP/single/wraithcairn" --selftest 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "SELFTEST ghostty=True"
          echo "$OUTPUT" | grep -q "SELFTEST echo_output_visible=True"
