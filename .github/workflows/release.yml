name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            ext: tar.gz
          - rid: win-x64
            os: ubuntu-latest
            ext: zip
          - rid: osx-arm64
            os: ubuntu-latest
            ext: tar.gz
          - rid: osx-x64
            os: ubuntu-latest
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (self-contained, not single-file)
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=false \
            -o publish/${{ matrix.rid }}

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../wraithcairn-${{ matrix.rid }}.tar.gz .

      - name: Package (zip)
        if: matrix.ext == 'zip'
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../wraithcairn-${{ matrix.rid }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wraithcairn-${{ matrix.rid }}
          path: wraithcairn-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
