# Release: runs on every push to the trunk (main), i.e. each merged change.
#
# Trunk-based flow (same model as mcp-private-library):
#   1. GitVersion computes the next version from the latest vX.Y.Z tag +
#      commits (patch bump by default; "+semver: minor" / "+semver: major"
#      in a commit message bumps further). First release is 0.1.0.
#   2. Create and push the matching git tag.
#   3. Publish self-contained builds for each platform with that version
#      stamped into the assembly.
#   4. Create a GitHub Release for the tag with the archives attached.
#
# The pushed tag becomes the version source for the NEXT release.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "website/**"
      - "**.md"
  workflow_dispatch:

# Needed to push the tag and create the release.
permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      informational: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
      - name: Checkout (full history for GitVersion)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Export version vars
        id: vars
        run: |
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION (tag v$VERSION)"

      # Idempotent: a re-run with an existing tag skips tagging.
      - name: Create and push git tag
        run: |
          set -euo pipefail
          TAG="${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping create."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

  publish:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            ext: tar.gz
            os: ubuntu-latest
          # Native arm64 runner so the binary can be smoke-tested in place.
          - rid: linux-arm64
            ext: tar.gz
            os: ubuntu-24.04-arm
            smoke: true
          - rid: win-x64
            ext: zip
            os: ubuntu-latest
          - rid: win-arm64
            ext: zip
            os: ubuntu-latest
          # macOS ships as wraithcairn.app (zip) so the Dock and Cmd+Tab show
          # it as an app; built on macOS to ad-hoc sign the bundle.
          - rid: osx-arm64
            ext: zip
            os: macos-latest
            app: true
          - rid: osx-x64
            ext: zip
            os: macos-latest
            app: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Self-contained single-file executable. Native libs (libghostty-vt,
      # Skia, HarfBuzz, System.Native) are bundled and self-extract on first
      # run; see KeepSystemNativeInSingleFile in wraithcairn.csproj.
      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:InformationalVersion=${{ needs.version.outputs.informational }} \
            -o publish/wraithcairn
          # SkiaSharp/HarfBuzz ship native .pdb files on Windows; drop them.
          rm -f publish/wraithcairn/*.pdb
          ls -la publish/wraithcairn

      - name: Smoke test ${{ matrix.rid }}
        if: matrix.smoke
        run: |
          file publish/wraithcairn/wraithcairn
          publish/wraithcairn/wraithcairn --version

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          cd publish
          tar -czf ../wraithcairn-${{ needs.version.outputs.version }}-${{ matrix.rid }}.tar.gz wraithcairn

      - name: Package (macOS .app)
        if: matrix.app
        run: |
          mkdir -p app
          python3 scripts/make-macos-app.py publish/wraithcairn app ${{ needs.version.outputs.version }}
          # Ad-hoc sign the whole bundle (the bare exe is linker-signed only);
          # Apple Silicon refuses to run an unsigned or mismatched bundle.
          codesign --force --deep --sign - app/wraithcairn.app
          codesign --verify --deep --strict app/wraithcairn.app
          app/wraithcairn.app/Contents/MacOS/wraithcairn --version
          # ditto keeps the bundle's symlinks/permissions/signature intact.
          ditto -c -k --keepParent app/wraithcairn.app \
            wraithcairn-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip

      - name: Package (zip)
        if: matrix.ext == 'zip' && !matrix.app
        run: |
          cd publish
          zip -qr ../wraithcairn-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip wraithcairn

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wraithcairn-${{ matrix.rid }}
          path: wraithcairn-${{ needs.version.outputs.version }}-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: wraithcairn ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Self-contained builds (no .NET install needed). Extract and run
            `wraithcairn` (`wraithcairn.exe` on Windows).

            | Platform | File |
            |---|---|
            | Linux x64 | `wraithcairn-${{ needs.version.outputs.version }}-linux-x64.tar.gz` |
            | Linux arm64 | `wraithcairn-${{ needs.version.outputs.version }}-linux-arm64.tar.gz` |
            | Windows x64 | `wraithcairn-${{ needs.version.outputs.version }}-win-x64.zip` |
            | Windows arm64 | `wraithcairn-${{ needs.version.outputs.version }}-win-arm64.zip` |
            | macOS Apple Silicon | `wraithcairn-${{ needs.version.outputs.version }}-osx-arm64.zip` (`wraithcairn.app`) |
            | macOS Intel | `wraithcairn-${{ needs.version.outputs.version }}-osx-x64.zip` (`wraithcairn.app`) |

            Commit: ${{ github.sha }}
