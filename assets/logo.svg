<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B7D8F"/><stop offset="1" stop-color="#46525F"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5D6E7E"/><stop offset="1" stop-color="#3C4751"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#536372"/><stop offset="1" stop-color="#343E48"/>
    </linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5866"/><stop offset="1" stop-color="#2D3640"/>
    </linearGradient>
    <linearGradient id="wordG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DCE6EE"/><stop offset="1" stop-color="#9FB2C2"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft10" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft5" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- mark (icon geometry, no tile background) -->
  <g transform="translate(26,10) scale(0.56)">
    <!-- the prompt, risen above the cairn -->
    <g filter="url(#glow)">
      <path d="M 188 100 L 252 150 L 188 200" fill="none" stroke="#5FD9BD" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="276" y="180" width="66" height="20" rx="9" fill="#5FD9BD"/>
    </g>
    <!-- ground shadow -->
    <ellipse cx="252" cy="446" rx="180" ry="15" fill="#000000" opacity="0.28" filter="url(#soft5)"/>
    <!-- the cairn -->
    <g stroke="#131A21" stroke-width="5" stroke-linejoin="round">
      <path d="M 78 444 L 92 390 L 196 380 L 330 384 L 414 396 L 422 444 Z" fill="url(#s4)"/>
      <path d="M 108 384 L 128 330 L 262 320 L 376 332 L 390 388 L 258 378 Z" fill="url(#s3)"/>
      <path d="M 158 326 L 148 278 L 260 264 L 352 278 L 360 328 L 250 318 Z" fill="url(#s2)"/>
      <path d="M 176 272 L 196 230 L 290 222 L 316 264 L 300 278 L 208 284 Z" fill="url(#s1)"/>
    </g>
    <!-- light from the prompt on the top edges -->
    <g stroke-linecap="round" fill="none">
      <path d="M 198 230 L 288 223" stroke="#C9F7EB" stroke-width="5" opacity="0.7"/>
      <path d="M 152 280 L 258 266" stroke="#BFEFE0" stroke-width="4" opacity="0.35"/>
      <path d="M 262 266 L 348 279" stroke="#BFEFE0" stroke-width="4" opacity="0.3"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="330" y="196" font-family="'JetBrainsMono NFM','JetBrainsMono Nerd Font Mono','JetBrains Mono',monospace"
        font-size="118" font-weight="700" letter-spacing="-2" fill="url(#wordG)">wraith<tspan fill="#5FD9BD">cairn</tspan></text>
  <text x="336" y="252" font-family="'JetBrainsMono NFM','JetBrainsMono Nerd Font Mono','JetBrains Mono',monospace"
        font-size="34" font-weight="500" letter-spacing="10" fill="#5E7082">YOUR SHELLS, RISEN</text>
</svg>
